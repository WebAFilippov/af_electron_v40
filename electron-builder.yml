appId: com.AFilippov.effectory
productName: effectory
copyright: Copyright © 2026 WebAFilippov
buildVersion: 7.0.0

directories:
  buildResources: build
  output: dist

files:
  - '!**/.vscode/*'
  - '!src/**'
  - '!scripts/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'

# Native artifacts.
#
# The C++ addon is loaded by the OS loader, which cannot read inside an asar
# archive, so it must be a real file on disk. It lives in `resources/native` in
# development and is copied to `<app>/resources/resources/native` when packaged —
# the destination mirrors the source path so the main process resolves it with the
# same expression in both modes (process.resourcesPath + "resources").
extraResources:
  - from: resources/native
    to: resources/native
    filter:
      - '**/*'

# Nothing native may be packed into the asar archive.
asarUnpack:
  - resources/**

win:
  icon: build/icon.ico
  executableName: Effectory
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false
  displayLanguageSelector: false
  deleteAppDataOnUninstall: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  menuCategory: true
  multiLanguageInstaller: true
  packElevateHelper: true
  runAfterFinish: true
  shortcutName: Effectory
  artifactName: '${productName}-${version}-setup.${ext}'
  uninstallDisplayName: '${productName} ${version}'
  installerLanguages:
    - en-US
    - ru-RU
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico

electronLanguages:
  - en-US
asar: true
compression: maximum
npmRebuild: true

publish:
  - provider: github
    owner: WebAFilippov
    repo: af_electron_v40
    releaseType: release

releaseInfo:
  releaseDate: '19/10/2026'
  releaseName: 'Effectory 7.0.0'
  releaseNotes: |
    Initial public release of Effectory.

    Features:
    - Тестировка

    This release focuses on core functionality and stability.
  vendor: WebAFilippov
